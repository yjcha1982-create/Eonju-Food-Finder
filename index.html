<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="카카오맵에서 내 주변 식당을 찾고 오늘의 점심을 무작위로 선택합니다."
    />
    <meta name="theme-color" content="#ff6330" />
    <title>오늘 뭐 먹지?</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("lunch-theme") || "orange";
      } catch {
        document.documentElement.dataset.theme = "orange";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#">🍚 오늘 뭐 먹지?</a>
      <div class="header-tools">
        <div class="theme-picker">
          <button
            id="themeButton"
            class="theme-button"
            type="button"
            aria-label="화면 테마 선택"
            aria-expanded="false"
            aria-controls="themeMenu"
          >
            <span class="theme-current-dot" aria-hidden="true"></span>
            <span id="themeLabel">주황</span>
          </button>
          <div id="themeMenu" class="theme-menu" role="menu" hidden>
            <button type="button" data-theme-value="orange" role="menuitem">
              <span class="theme-swatch orange"></span>주황
            </button>
            <button type="button" data-theme-value="kakao" role="menuitem">
              <span class="theme-swatch kakao"></span>카카오
            </button>
            <button type="button" data-theme-value="mint" role="menuitem">
              <span class="theme-swatch mint"></span>민트
            </button>
            <button type="button" data-theme-value="blue" role="menuitem">
              <span class="theme-swatch blue"></span>블루
            </button>
            <button type="button" data-theme-value="dark" role="menuitem">
              <span class="theme-swatch dark"></span>다크
            </button>
          </div>
        </div>
        <label class="compact-select radius-select">
          <span>도보</span>
          <select id="radiusSelect" aria-label="검색 거리">
            <option value="200">200m</option>
            <option value="400" selected>400m</option>
            <option value="600">600m</option>
            <option value="800">800m</option>
            <option value="1000">1km</option>
          </select>
        </label>
      </div>
    </header>

    <main class="page">
      <section class="location-panel" aria-labelledby="locationTitle">
        <div class="panel-heading">
          <div>
            <p class="eyebrow">위치 설정</p>
            <h1 id="locationTitle">어디에서 찾을까요?</h1>
          </div>
          <p id="dataStatus">위치를 확인하고 있습니다.</p>
        </div>

        <form id="addressForm" class="address-form">
          <label class="sr-only" for="addressInput">주소 또는 장소명</label>
          <input
            id="addressInput"
            type="search"
            placeholder="주소 또는 장소명 (예: 언주역)"
            autocomplete="street-address"
          />
          <button class="primary-button" type="submit">검색</button>
          <button id="currentLocationButton" class="secondary-button" type="button">
            내 위치
          </button>
        </form>

        <div class="location-summary">
          <span>기준 위치</span>
          <strong id="locationLabel">확인 중...</strong>
          <button id="saveLocationButton" class="text-button" type="button" disabled>
            이 위치 저장
          </button>
        </div>

      </section>

      <section class="picker-section" aria-labelledby="pickerTitle">
        <div class="picker-copy">
          <p class="eyebrow">점심 뽑기</p>
          <h2 id="pickerTitle">오늘은 뭘 먹을까요?</h2>
          <p>원하는 음식 종류를 고른 뒤 무작위로 뽑아보세요.</p>

          <div id="categoryFilters" class="category-row" aria-label="음식 카테고리"></div>

          <div class="shuffle-mode" aria-label="랜덤 선택 범위">
            <label>
              <input type="radio" name="shuffleMode" value="all" checked />
              <span>전체에서 뽑기</span>
            </label>
            <label>
              <input type="radio" name="shuffleMode" value="liked" />
              <span>♥ 좋아요만</span>
            </label>
          </div>

          <button id="pickButton" class="pick-button" type="button" disabled>
            <span>점심 뽑기</span>
            <small id="pickCount">식당을 불러오는 중</small>
          </button>
        </div>

        <div id="pickResult" class="pick-result" aria-live="polite">
          <div class="result-placeholder">
            <span>?</span>
            <p>뽑기 버튼을 눌러주세요.</p>
          </div>
        </div>
      </section>

      <section class="list-section" aria-labelledby="listTitle">
        <div class="list-heading">
          <div>
            <p class="eyebrow">카카오맵 검색 결과</p>
            <h2 id="listTitle">주변 식당 <span id="resultCount">0</span></h2>
          </div>
          <div class="list-tools">
            <input id="searchInput" type="search" placeholder="식당 이름 검색" />
            <select id="sortSelect" aria-label="정렬">
              <option value="distance">가까운 순</option>
              <option value="preferred">선호 우선</option>
              <option value="name">이름 순</option>
            </select>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <strong>주변 식당을 찾고 있습니다.</strong>
          <p>카카오맵에 등록된 실제 장소만 표시합니다.</p>
        </div>
        <div id="restaurantList" class="restaurant-list" aria-live="polite"></div>
      </section>
    </main>

    <footer>
      장소 검색은 카카오 Local API, 길찾기는 카카오맵을 사용합니다.
    </footer>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
